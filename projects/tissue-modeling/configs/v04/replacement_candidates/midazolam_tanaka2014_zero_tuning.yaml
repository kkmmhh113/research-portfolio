expected_screen_state: pass_expected
structural_limitations:
  - Clinical dose basis and dosage form are unresolved; the 1 mg design value must not be assumed to be free-base tablet mass.
  - Kp=1 cannot reproduce the independent Vss prior exactly, so pass_expected applies to numerical/mass and broad parent-PK gates only.
  - The shared enzyme factor does not distinguish intestinal from hepatic CYP3A4 or CYP3A5.
  - The current reduced model lacks sequential 1-hydroxymidazolam glucuronidation and cannot validate metabolite PK.
  - Parent-only screening is authorized only against synthetic engineering endpoints, not Tanaka2014 outcomes.
