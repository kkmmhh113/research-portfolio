    (97%), negligible unchanged urinary excretion (<0.5%), CYP3A4 metabolism and
    broad IV CL/Vd ranges. Kvitne et al. 2023, PMID 37162619, supplies an independent
    mean CL 31 L/h and F 0.46 in healthy adults; Heizmann et al. 1983, PMID 6138080,
    supplies Vss 50.2 L. An independent composite human model supplies ka 2.31/h.
    The reduced mapping fixes Km=1 mg/L and Vmax=31*Km/fu. Kp=1 is a declared
    engineering default. No PKDB00136 outcome or fitted value was opened or used.
