pathway_model:
  evidence_role: mixed_independent_and_synthetic_scaffold
  pathways:
    ugt:
      reaction_id: paracetamol_ugt_conjugation
      mechanism_id: ugt_activity
      vmax_umol_h: 6055.242439024391
      km_umol_l: 462.0
      zone_activity: [0.20, 0.30, 0.50]
      parameter_provenance: >-
        Mechanistic translation already declared in the v0.3 paracetamol
        configuration: UGT fraction 0.58, apparent CL/F 18.53 L/h, fu 0.82,
        and UGT1A1 Km 462 umol/L. Vmax is the deterministic low-concentration
        translation CL_pathway*Km/fu. No clinical outcome was fitted.
    sult:
      reaction_id: paracetamol_sult_conjugation
      mechanism_id: sult_activity
      vmax_umol_h: 677.9268292682927
      km_umol_l: 100.0
      zone_activity: [0.20, 0.30, 0.50]
      parameter_provenance: >-
        ENGINE-ONLY SYNTHETIC PLACEHOLDER. The v0.3 SULT fraction 0.30 and
        apparent CL/F 18.53 L/h define the low-concentration pathway clearance;
        Km=100 umol/L is deliberately synthetic so saturation behavior can be
        tested. It must be replaced by independently sourced evidence and pass
        identifiability review before any external evaluation.
    cyp:
      reaction_id: paracetamol_cyp_to_aggregate_thiol_conjugate
      mechanism_id: cyp2e1_activity
      intrinsic_clearance_l_h: 1.8078048780487807
      zone_activity: [0.20, 0.30, 0.50]
      parameter_provenance: >-
        Deterministic unbound-clearance translation of the v0.3 CYP2E1 fraction
        0.08, apparent CL/F 18.53 L/h, and fu 0.82. The product is a Tier-A
        aggregate cysteine/thiol conjugate bookkeeping species, not a direct
        NAPQI or toxicity observation.
  metabolite_renal_clearance_l_h:
    paracetamol_glucuronide: 8.0
    paracetamol_sulfate: 8.0
    paracetamol_oxidative_conjugate: 8.0
  metabolite_liver_partition_coefficient:
    paracetamol_glucuronide: 1.0
    paracetamol_sulfate: 1.0
    paracetamol_oxidative_conjugate: 1.0
  parameter_provenance: >-
    Tier-A software and mechanism scaffold. Formula-derived species masses and
    signed cofactor participants are chemically accounted. Metabolite-specific
    renal clearances and Kp values reuse the generic v0.3 development default
    solely for engine verification; they are not identified clinical
    parameters and must not be used as an external-validation claim.
