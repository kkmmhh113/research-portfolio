mechanism:
  mechanism_id: enalaprilat_filtration_secretion_v04
  status: active_fixed_candidate
  species_id: enalaprilat
  parameters:
    fraction_unbound:
      value: 0.621
      unit: fraction
      bounds: [0.55, 0.70]
      evidence_grade: A
      parameter_role: fixed_independent
      provenance: >-
        Direct human protein-binding result already documented in the v0.3
        evidence record; not derived from a v0.4 outcome.
    reference_gfr:
      value: 7.146
      unit: L/h
      bounds: [5.5, 9.0]
      evidence_grade: A
      parameter_role: fixed_independent
      provenance: >-
        119.1 mL/min inulin clearance converted deterministically to L/h.
    direct_total_renal_clearance:
      value: 6.48
      unit: L/h
      bounds: [5.04, 7.92]
      evidence_grade: A
      parameter_role: fixed_independent
      provenance: >-
        Direct healthy-human total-plasma renal clearance already recorded in
        the v0.3 evidence manifest.
    filtration_clearance_on_total:
      value: 4.437666
      unit: L/h
      evidence_grade: B
      parameter_role: derived_deterministically
      formula: fraction_unbound * reference_gfr
      provenance: Transparent unit/basis translation from the fixed inputs.
    secretion_clearance_on_unbound:
      value: 3.288782608695653
      unit: L/h
      bounds: [0.0, 8.0]
      evidence_grade: C
      parameter_role: derived_deterministically
      formula: >-
        (direct_total_renal_clearance - filtration_clearance_on_total) /
        fraction_unbound
      provenance: >-
        Residual linear secretion term used only as a fixed mechanistic split.
        It is not independently estimated and must remain sensitivity-labeled.
  saturable_secretion:
    status: not_admitted
    reason: >-
      A Vmax/Km secretion law requires transporter or multi-dose development
      evidence and a bounded identifiability profile.
