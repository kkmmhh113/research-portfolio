schema_version: our_star.v04_midazolam_mechanism_parameters.v1
status: development_candidate_not_external_admitted
clinical_status: research_only_not_for_dosing_or_trial_replacement
candidate_id: midazolam_intestinal_hepatic_cyp3a_to_ugt
base_model_id: our_star.hepatic_pathway_pbpk.v0.4.dev.midazolam
candidate_model_id: our_star.midazolam_gut_liver_reaction_pbpk.v0.4.dev

species:
  parent:
    species_id: midazolam
    molecular_weight_g_mol: 325.77
  primary_product:
    species_id: one_hydroxymidazolam
    molecular_weight_g_mol: 341.77
  conjugate_sink:
    species_id: one_hydroxymidazolam_glucuronide
    molecular_weight_g_mol: 517.89
    observation_status: cumulative_formation_sink_not_plasma_or_urine_prediction
  minor_product_sink:
    species_id: midazolam_minor_metabolite_moiety
    observation_status: parent_moiety_accounting_only

fixed_parameters:
  hydroxy_fraction_unbound: 0.10
  hydroxy_kp_gut: 1.0
  hydroxy_kp_liver: 1.0
  hydroxy_kp_kidney: 1.0
  hydroxy_kp_rest: 1.0
  intestinal_extraction_fraction_reference: 0.43
  intestinal_cyp3a_unbound_clearance_l_h: 1810.5263157894738
  hepatic_cyp3a_unbound_clearance_l_h: 1033.3333333333335
  major_formation_fraction: 0.65
  effective_ugt_zone_activity: [0.20, 0.30, 0.50]
  effective_ugt_zone_activity_status: engineering_default_not_isoform_evidence

development_estimable_parameters:
  - name: ugt_unbound_clearance_l_h
    initial: 100.0
    lower: 1.0
    upper: 3000.0
    scale: log
    evidence_grade: D
    interpretation: >-
      Model-effective conditional clearance only. It may compensate for fixed
      1-OH Kp=1 values, absent unconjugated renal clearance, reduced product
      distribution, fixed formation fraction, and engineering-default
      zonation. It is not an isolated physiological UGT capacity or an IVIVE
      estimate and must not be transferred to another model structure.
    rule: >-
      This is the only development-estimable parameter. Formation fraction,
      intestinal and hepatic CYP3A, binding, Kp, physiology, absorption, and
      the parent clearance prior remain fixed. It may be estimated only from
      development data and requires an independent development holdout before
      mechanism admission.

mechanism_factors:
  intestinal_cyp3a: 1.0
  hepatic_cyp3a: 1.0
  effective_ugt: 1.0

evidence:
  - evidence_id: thummel1996_intestinal_and_hepatic_first_pass
    grade: A
    source: https://pubmed.ncbi.nlm.nih.gov/8646820/
    supports:
      - intestinal_and_hepatic_cyp3a_sites
      - intestinal_extraction_fraction_reference
    note: >-
      Human IV/oral study; the reference intestinal extraction fraction is
      converted deterministically to an unbound clearance for the 70 kg
      reference portal flow. It is not fitted to PKDB00136.
  - evidence_id: midazolam_official_label
    grade: A
    source: https://dailymed.nlm.nih.gov/dailymed/getFile.cfm?setid=0be63f63-6a93-4782-8f9c-d13ca5ae44bd&type=pdf
    supports:
      - cyp3a4_parent_to_one_hydroxymidazolam
      - subsequent_glucuronidation
      - hydroxy_fraction_unbound
      - major_formation_fraction_range
      - predominant_urinary_glucuronide_recovery
  - evidence_id: zhu2008_human_microsomal_glucuronidation
    grade: A
    source: https://pubmed.ncbi.nlm.nih.gov/17998299/
    supports:
      - ugt1a4_n_glucuronidation
      - ugt2b4_ugt2b7_o_glucuronidation
    note: >-
      In-vitro kinetics establish the reaction but are not silently converted
      to a whole-human organ capacity; the effective clearance remains the
      single bounded development parameter.
  - evidence_id: lippert2017_midazolam_oh_midazolam_pbpk_structure
    grade: C
    source: https://pmc.ncbi.nlm.nih.gov/articles/PMC5460240/
    supports:
      - cyp3a4_in_liver_and_intestine
      - ugt1a4_sequential_reaction
      - hydroxy_molecular_weight_and_binding_crosscheck

identifiability_policy:
  required_observations:
    - plasma_midazolam_concentration_time
    - plasma_one_hydroxymidazolam_concentration_time
  expected_signatures:
    - intestinal_cyp3a_ablation_increases_parent_exposure
    - hepatic_cyp3a_ablation_increases_parent_exposure
    - effective_ugt_ablation_increases_one_hydroxymidazolam_exposure
  minimum_normalized_sensitivity: 1.0e-6
  relative_singular_value_threshold: 1.0e-6
  maximum_absolute_parameter_correlation_exclusive: 0.95
  every_estimable_profile_two_sided_bounded_and_connected: true
  repeated_start_stability_required: true
  independent_development_holdout_required: true
  maximum_mass_balance_error_mg_exclusive: 1.0e-5

limitations:
  - The intestinal extraction conversion is a fixed reference-adult approximation, not an individual Qgut model.
  - CYP3A4 and CYP3A5 are not separately parameterized.
  - UGT1A4, UGT2B4, and UGT2B7 are represented by one effective removal parameter.
  - The effective UGT zone fractions [0.20, 0.30, 0.50] are an engineering default, not an isoform-specific human zonation measurement.
  - The inherited parent CYP zone fractions are fixed engineering structure and were not made estimable in this one-parameter development evaluation.
  - The glucuronide state is cumulative formation, not a plasma or urinary concentration claim.
  - Direct renal disposition of unconjugated 1-hydroxymidazolam is not invented.
  - Kp values for the product remain explicit engineering defaults of one.
  - No pharmacodynamic sedation or receptor model is present.
