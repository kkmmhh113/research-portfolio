schema_version: our_star.captopril_mechanism.v0.5
candidate_id: captopril_parent_renal_independent_evidence_v05
status: development_candidate_not_external_admitted
clinical_status: research_only_not_for_dosing_or_trial_replacement
context_of_use: >-
  Research-only 70 kg reference-adult parent PK candidate. It is not validated
  for dosing, efficacy, toxicity, renal dose adjustment, diagnosis, or human
  trial replacement.

drug:
  name: captopril_parent_independent_evidence_v05
  smiles: "C[C@H](CS)C(=O)N1CCC[C@H]1C(=O)O"
  molecular_weight_g_mol: 217.29
  fraction_unbound_plasma: 0.725
  absorption_rate_h: 2.18
  fraction_absorbed: 0.71
  kp_gut: 1.0
  kp_liver: 1.0
  kp_kidney: 1.0
  kp_rest: 1.0
  liver_vmax_mg_h: 0.0
  liver_km_mg_l: 1.0
  liver_zone_activity: [1.0, 1.0, 1.0]
  gut_vmax_mg_h: 0.0
  gut_km_mg_l: 1.0
  renal_clearance_l_h: 0.0
  metabolite_renal_clearance_l_h: 0.0
  metabolite_mass_yield: 0.0
  parameter_provenance: >-
    Captopril identity, MW, and 25-30% circulating protein binding are from the
    official DailyMed label; fu=0.725 is the prespecified midpoint. Absorbed
    fraction 0.71 is from Duchin et al. 1982 (PMID 7037265). Kp=1 and ka=2.18/h
    are inherited cross-drug engineering defaults, not fitted captopril values.
    The custom renal module owns all renal clearance, hence the legacy renal
    clearance fields are zero. No candidate-study outcome was opened or used.

mechanism:
  mechanism_id: captopril_filtration_secretion_parent_baseline_v05
  status: active_fixed_candidate_not_admitted
  provenance: >-
    Fixed independent-evidence assembly. Duchin et al. 1982 (PMID 7037265)
    reports healthy-human total clearance about 0.8 L/kg/h and Vss about
    0.7 L/kg. Singhvi et al. 1982 (PMID 7047044) reports renal clearance
    388 mL/kg/h and probenecid-sensitive net secretion. DailyMed reports
    25-30% binding, predominantly urinary elimination, and disulfide products.
    No PK-DB candidate-study abstract, media, result, or outcome informed this
    configuration.
  fixed_parameters:
    fraction_unbound: 0.725
    reference_gfr_l_h: 7.5
    renal_clearance_l_h: 27.16
    systemic_total_clearance_l_h: 56.0
  deterministic_derivations:
    filtration_clearance_on_total_l_h:
      formula: fraction_unbound * reference_gfr_l_h
      value: 5.4375
    secretion_clearance_on_total_l_h:
      formula: renal_clearance_l_h - filtration_clearance_on_total_l_h
      value: 21.7225
    secretion_clearance_on_unbound_l_h:
      formula: secretion_clearance_on_total_l_h / fraction_unbound
      value: 29.96206896551724
    unresolved_nonrenal_clearance_l_h:
      formula: systemic_total_clearance_l_h - renal_clearance_l_h
      value: 28.84
  mechanism_factors:
    - glomerular_filtration
    - active_tubular_secretion
    - unresolved_nonrenal_loss
  reversible_disulfide_candidate:
    enabled: false
    status: disabled_not_admitted
    forward_rate_h: null
    reverse_rate_h: null
    reason: >-
      Human sources support disulfide formation and possible reservoir behavior,
      but this evidence set does not identify transferable whole-human forward
      and reverse rates. The unresolved nonrenal sink must not be interpreted as
      a measured disulfide species, and it has no return flux.

dose_contract:
  accepted_basis_id: captopril_parent
  legacy_basis_id: legacy_active_parent_mg
  oral_fraction_absorbed: 0.71
  oral_accounting: >-
    At dose application, 71% enters a first-order absorption depot and 29% an
    unabsorbed/fecal accounting sink. The generic 2.18/h rate only controls
    timing. The independently reported systemic bioavailability of 0.62 is
    retained as evidence but is not forced into an anatomically invented
    first-pass compartment.

evidence:
  official_label:
    url: https://dailymed.nlm.nih.gov/dailymed/fda/fdaDrugXsl.cfm?setid=607687f4-63cf-411c-a20b-21d238a6b7a7
    supports:
      - molecular_weight_217_29_g_mol
      - circulating_binding_25_to_30_percent
      - urinary_elimination_and_disulfide_products
  primary_healthy_iv_oral_pk:
    citation: Duchin KL et al. Clin Pharmacol Ther. 1982;31:452-458.
    pmid: "7037265"
    url: https://pubmed.ncbi.nlm.nih.gov/7037265/
    supports:
      - total_clearance_approximately_0_8_l_kg_h
      - vss_approximately_0_7_l_kg
      - fraction_absorbed_0_71
      - systemic_bioavailability_0_62_not_yet_structurally_mapped
  primary_renal_handling:
    citation: Singhvi SM et al. Clin Pharmacol Ther. 1982;32:182-189.
    pmid: "7047044"
    url: https://pubmed.ncbi.nlm.nih.gov/7047044/
    supports:
      - renal_clearance_388_ml_kg_h
      - probenecid_sensitive_net_tubular_secretion
      - at_least_78_percent_of_renal_excretion_due_to_net_secretion
  primary_disulfide_clinical_evidence:
    citation: Drummer OH et al. Eur J Clin Pharmacol. 1987;32:267-271.
    pmid: "3297733"
    url: https://pubmed.ncbi.nlm.nih.gov/3297733/
    supports:
      - human_disulfide_conjugate_accumulation
      - qualitative_possible_return_to_free_parent
    does_not_support:
      - transferable_forward_rate
      - transferable_reverse_rate

engineering_assumptions:
  - Uniform Kp=1 gives a reduced-model distribution volume near, but not fitted to, the independent 49 L Vss prior.
  - The oral absorption timing rate is a frozen cross-drug engineering default.
  - Reference GFR 7.5 L/h is a conventional 125 mL/min reference-adult value, not a candidate-outcome estimate.
  - Renal and unresolved-clearance allometry uses the existing platform exponent 0.75.
  - Directly observed renal clearance acts on systemic total concentration; it is not reinterpreted as an intrinsic kidney clearance subject to a second perfusion limitation.
  - Filtration and secretion are a systemic renal-clearance bookkeeping decomposition; the kidney-tissue state is distribution-only and this candidate is not yet a spatial renal transporter model.
  - Ablation signs are structural consequences of the algebraic clearance split, not empirical mechanism validation; unchanged-urine and/or probenecid or renal-function development evidence is required for admission.
  - The current oral delivered fraction is 0.71 absorption, not the separately reported 0.62 systemic bioavailability; this unmapped first-pass difference is a declared transfer risk.
  - The unresolved nonrenal sink may aggregate disulfides and other routes; it is neither a named species prediction nor an assay bridge.
  - The model has no explicit reversible protein-bound captopril state. Clinical scoring may use only a separately frozen operational-total unchanged-parent ObservationSpec; it must not be described as a mechanistic free-versus-bound assay prediction.
  - No transporter identity, saturation law, renal reabsorption, ACE binding, pharmacodynamics, or disulfide exchange kinetics are claimed.
  - The shared plasma_parent_mg_l column is only a legacy central blood-equivalent summary alias; clinical scoring requires a separately frozen ObservationSpec and remains unauthorized while analyte and assay identity are unresolved.

forbidden_outcome_access_during_this_build:
  study_ids: [PKDB00822, PKDB01088, PKDB01069]
  attestation: >-
    No abstract, media endpoint, result table, concentration-time row, or other
    outcome for these candidate or reserve studies was searched or opened while
    building this independent-evidence model.
