  parameter_provenance: >-
    Zero-curve-tuning translation frozen for v0.3. Enalapril MW 376.5 g/mol,
    protein binding 45% (fu .55), carboxylesterase Km 710 umol/L, hepatic CL
    354 mL/min, and parent fu .55 come from the secondary literature table in
    Claassen et al. 2013, doi:10.3389/fphys.2013.00004 and are graded C rather
    than primary-verified. Parent renal CL 229 mL/min (13.74 L/h) and
    enalaprilat renal CL 108 mL/min (6.48 L/h) are direct healthy-human values
    from Noormohamed et al. 1990, PMID:2158548. Approximately 60% absorption is
    independently documented in the product label. The reduced mapping
    converts Km to 267.315 mg/L and sets Vmax=hepatic_CL*Km/fu. Kp=1 is the
    preregistered unseen-drug default. Study-specific optimized Vmax/renal
    values in the PBPK article are explicitly not used. No Dayyih2017 or
    VanHecken2020 concentration was used to select or change these numbers.
