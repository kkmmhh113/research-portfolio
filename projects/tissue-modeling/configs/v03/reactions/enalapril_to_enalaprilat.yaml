metabolite:
  reaction_id: enalapril_to_enalaprilat
  metabolite_species_id: enalaprilat
  metabolite_name: enalaprilat_active_metabolite
  metabolite_smiles: "C[C@@H](C(=O)N1CCC[C@H]1C(=O)O)N[C@@H](CCc1ccccc1)C(=O)O"
  metabolite_molecular_weight_g_mol: 348.4
  coproduct_id: enalapril_parent_derived_fragment
  coproduct_name: parent-derived mass released during ester hydrolysis
  parameter_provenance: >-
    One-to-one enalapril-to-enalaprilat identity and molecular weights from
    Claassen et al. 2013, doi:10.3389/fphys.2013.00004. The 28.1 g/mol
    difference is tracked as administered-parent-derived coproduct mass. This
    adapter closes administered drug mass; it is not a complete elemental
    hydrolysis equation because solvent water is outside the dosed mass pool.
    No clinical concentration curve sets the stoichiometry.
