[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "our-star-portfolio"
version = "0.1.0"
description = "Reduced PBPK models, numerical simulation, and evaluation utilities"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
