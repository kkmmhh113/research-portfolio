name: Code checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [drug-response, tissue-modeling]
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: projects/${{ matrix.project }}/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: python -m pytest -q
      - name: Run molecular feature example
        if: matrix.project == 'drug-response'
        run: python examples/molecular_features.py
      - name: Run synthetic PBPK example
        if: matrix.project == 'tissue-modeling'
        run: python examples/synthetic_pbpk.py
